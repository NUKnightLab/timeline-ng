<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Diagram: a slide viewer on top, with the TimeNav strip below it</title>
  <rect x="1" y="1" width="638" height="328" rx="6" fill="#fff" stroke="#e5e7eb"/>

  <!-- slide viewer -->
  <rect x="16" y="16" width="608" height="216" rx="4" fill="#fff" stroke="#e5e7eb" stroke-dasharray="4 3"/>
  <text x="30" y="34" font-size="11" fill="#6b7280" font-family="sans-serif" letter-spacing="0.03em">SLIDE VIEWER</text>

  <!-- media block -->
  <rect x="30" y="46" width="220" height="170" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="140" y="135" font-size="13" fill="#9ca3af" font-family="sans-serif" text-anchor="middle">Media</text>

  <!-- text column -->
  <rect x="270" y="46" width="60" height="20" rx="10" fill="#fdf1ea" stroke="#f3cbae"/>
  <text x="300" y="60" font-size="10" fill="#93370c" font-family="sans-serif" text-anchor="middle">Date</text>

  <rect x="270" y="78" width="290" height="16" rx="2" fill="#1d1f21"/>
  <text x="278" y="90" font-size="10" fill="#fff" font-family="sans-serif">Headline</text>

  <rect x="270" y="108" width="330" height="8" rx="2" fill="#d1d5db"/>
  <rect x="270" y="124" width="330" height="8" rx="2" fill="#d1d5db"/>
  <rect x="270" y="140" width="220" height="8" rx="2" fill="#d1d5db"/>

  <!-- TimeNav -->
  <rect x="16" y="252" width="608" height="62" rx="4" fill="#fff" stroke="#e5e7eb" stroke-dasharray="4 3"/>
  <text x="30" y="270" font-size="11" fill="#6b7280" font-family="sans-serif" letter-spacing="0.03em">TIMENAV</text>
  <line x1="34" y1="298" x2="606" y2="298" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="90" cy="298" r="5" fill="#9ca3af"/>
  <circle cx="180" cy="298" r="5" fill="#9ca3af"/>
  <circle cx="320" cy="298" r="8" fill="#df4e13"/>
  <circle cx="460" cy="298" r="5" fill="#9ca3af"/>
  <circle cx="560" cy="298" r="5" fill="#9ca3af"/>

  <!-- connector from current dot to viewer -->
  <line x1="320" y1="290" x2="320" y2="238" stroke="#df4e13" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
