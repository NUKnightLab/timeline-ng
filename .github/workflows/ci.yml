name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `workers/og-preview` is the one package that consumes core as a built
      # package rather than aliasing its source (see CLAUDE.md), so its
      # typecheck resolves `@knight-lab/timeline-ng-core` through
      # `packages/core/dist`. In a clean checkout there is no dist yet, and
      # every run since the worker landed has failed here with TS2307 — a
      # local checkout passes only because an earlier build left one behind.
      - run: pnpm --filter @knight-lab/timeline-ng-core build

      - run: pnpm typecheck

      - run: pnpm test:run

      # Last because it is the slowest, but the reason this workflow exists:
      # it builds a clean checkout, so a source file that was never committed
      # fails here instead of during a release tag.
      - run: pnpm build
